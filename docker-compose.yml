# Ambiente de desenvolvimento: banco PostgreSQL + API.
# O front-end roda com `pnpm dev` e fala com a API em http://localhost:8000.
#
#   cp .env.example .env
#   docker compose up -d
#   docker compose exec api python -m app.seed   # dados de demonstração (opcional)

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cogni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cogni}
      POSTGRES_DB: cogni
    volumes:
      - dados:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cogni"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cogni:${POSTGRES_PASSWORD:-cogni}@db:5432/cogni
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  dados:
